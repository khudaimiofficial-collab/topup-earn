<!-- ================= DYNAMIC BOT & USER HEADER ================= -->
<style>
  .app-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #0f172a;
    padding: 10px 14px;
    border-radius: 20px;
    border: 1px solid rgba(56, 189, 248, 0.25);
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6), 0 0 15px rgba(56, 189, 248, 0.12);
    margin-bottom: 14px;
    width: 100%;
    box-sizing: border-box;
    user-select: none;
  }

  .header-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
  }

  .brand-avatar-box {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    overflow: hidden;
    border: 1.5px solid #38bdf8;
    box-shadow: 0 0 12px rgba(56, 189, 248, 0.45);
    display: flex;
    align-items: center;
    justify-content: center;
    background: #1e293b;
    flex-shrink: 0;
  }

  .brand-avatar-box img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .brand-text { min-width: 0; }

  .brand-text h1 {
    font-size: 14px;
    font-weight: 800;
    color: #38bdf8;
    letter-spacing: -0.2px;
    margin: 0;
    text-shadow: 0 0 8px rgba(56, 189, 248, 0.4);
    line-height: 1.2;
    max-width: 140px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .brand-text span {
    font-size: 10px;
    color: #94a3b8;
    display: block;
  }

  .header-user {
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(255, 255, 255, 0.05);
    padding: 5px 10px 5px 6px;
    border-radius: 24px;
    border: 1px solid rgba(255, 255, 255, 0.08);
    cursor: pointer;
    transition: transform 0.15s ease;
    -webkit-tap-highlight-color: transparent;
    outline: none;
  }

  .header-user:active { transform: scale(0.95); }
  .header-user:focus-visible { box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.6); }

  .user-avatar-wrap {
    position: relative;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .user-avatar-img {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
    border: 1.5px solid #38bdf8;
    display: none;
    background: #1e293b;
  }

  .user-avatar-fallback {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: linear-gradient(135deg, #38bdf8, #2563eb);
    color: #fff;
    font-size: 14px;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1.5px solid #38bdf8;
  }

  .status-dot-badge {
    position: absolute;
    bottom: -1px;
    right: -1px;
    width: 9px;
    height: 9px;
    background: #22c55e;
    border: 1.5px solid #0f172a;
    border-radius: 50%;
    box-shadow: 0 0 6px #22c55e;
  }

  .user-info-text {
    display: flex;
    flex-direction: column;
    text-align: left;
    min-width: 0;
  }

  .user-name-text {
    font-size: 12px;
    font-weight: 700;
    color: #fff;
    max-width: 80px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    line-height: 1.2;
  }

  .user-sub-text {
    font-size: 9px;
    color: #22c55e;
    font-weight: 800;
    text-transform: uppercase;
  }
</style>

<header class="app-header">
  <!-- Bot Info Left (fully dynamic) -->
  <div class="header-brand">
    <div class="brand-avatar-box">
      <img id="botHeaderPhoto"
           src=""
           alt="Bot"
           style="display:none;"
           onerror="this.style.display='none'; var f=document.getElementById('botFallbackIcon'); if(f) f.style.display='block';" />
      <span id="botFallbackIcon" style="font-size:20px;">⚡</span>
    </div>
    <div class="brand-text">
      <h1 id="botTitle">…</h1>
      <span id="botSubtitle">Instant Auto Payout</span>
    </div>
  </div>

  <!-- User Profile Right (fully dynamic) -->
  <div class="header-user" id="headerUserBtn" role="button" tabindex="0" aria-label="Open profile">
    <div class="user-avatar-wrap">
      <img id="userHeaderPhoto" class="user-avatar-img" src="" alt="User" />
      <div id="userHeaderFallback" class="user-avatar-fallback">?</div>
      <span class="status-dot-badge"></span>
    </div>

    <div class="user-info-text">
      <span class="user-name-text" id="userName">…</span>
      <span class="user-sub-text">ACTIVE</span>
    </div>
  </div>
</header>

<script>
  (function () {
    'use strict';

    /* ============================================================
       BOT CONFIG — set from index.html via window.BOT_CONFIG
       before this header loads, or fall back to defaults.
       Telegram does NOT expose bot name/photo via initDataUnsafe,
       so we rely on this config for the bot's identity.
       ============================================================ */
    var BOT_CONFIG = window.BOT_CONFIG || {
      name: 'Free Gram Token',
      photo: '',
      subtitle: 'Instant Auto Payout'
    };

    /* ============================================================
       HELPERS
       ============================================================ */
    function setImage(imgEl, fallbackEl, url) {
      if (!imgEl || !url) return;
      imgEl.onload = function () {
        imgEl.style.display = 'block';
        if (fallbackEl) fallbackEl.style.display = 'none';
      };
      imgEl.onerror = function () {
        imgEl.style.display = 'none';
        if (fallbackEl) fallbackEl.style.display = 'flex';
      };
      imgEl.src = url;
    }

    function firstLetter(str) {
      return (str && str.trim().charAt(0) || '?').toUpperCase();
    }

    /* ============================================================
       HYDRATION
       ============================================================ */
    function hydrateHeader() {
      var tg     = window.Telegram && window.Telegram.WebApp;
      var init   = tg && tg.initDataUnsafe;
      var tgUser = init && init.user;

      var botTitleEl  = document.getElementById('botTitle');
      var botSubEl    = document.getElementById('botSubtitle');
      var botPhotoEl  = document.getElementById('botHeaderPhoto');
      var botFallback = document.getElementById('botFallbackIcon');

      var nameEl      = document.getElementById('userName');
      var photoEl     = document.getElementById('userHeaderPhoto');
      var fallbackEl  = document.getElementById('userHeaderFallback');

      /* ---------- BOT ---------- */
      var botName = BOT_CONFIG.name || 'Bot';
      if (botTitleEl) botTitleEl.textContent = botName;
      if (botSubEl && BOT_CONFIG.subtitle) botSubEl.textContent = BOT_CONFIG.subtitle;

      if (BOT_CONFIG.photo) {
        if (botFallback) botFallback.style.display = 'none';
        setImage(botPhotoEl, botFallback, BOT_CONFIG.photo);
      } else {
        if (botPhotoEl) botPhotoEl.style.display = 'none';
        if (botFallback) botFallback.style.display = 'block';
      }

      /* ---------- USER ---------- */
      if (!tgUser) return;

      var firstName = (tgUser.first_name || '').trim();
      var displayName = firstName || (tgUser.username ? '@' + tgUser.username : 'Guest');

      if (nameEl) nameEl.textContent = displayName;
      if (fallbackEl) fallbackEl.textContent = firstLetter(displayName);

      if (typeof tgUser.photo_url === 'string' && tgUser.photo_url.length > 0) {
        setImage(photoEl, fallbackEl, tgUser.photo_url);
      }
    }

    /* ============================================================
       BOOTSTRAP
       ============================================================ */
    function boot() {
      var tg = window.Telegram && window.Telegram.WebApp;
      if (tg) {
        try { tg.ready(); tg.expand(); } catch (e) {}
      }
      hydrateHeader();
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', boot);
    } else {
      boot();
    }

    window.addEventListener('load', boot, { once: true });

    /* ============================================================
       NAVIGATION
       ============================================================ */
    function navigateToProfile(e) {
      if (e) e.preventDefault();
      try { window.Telegram?.WebApp?.HapticFeedback?.impactOccurred('light'); } catch (err) {}

      if (typeof window.navigateSpa === 'function') {
        window.navigateSpa('/profile.html');
      } else {
        window.location.href = '/profile.html';
      }
    }

    var btn = document.getElementById('headerUserBtn');
    if (btn) {
      btn.addEventListener('click', navigateToProfile);
      btn.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') navigateToProfile(e);
      });
    }

    /* ============================================================
       EXPOSE FOR RE-HYDRATION AFTER BACKEND DATA LOADS
       ============================================================ */
    window.hydrateHeader = hydrateHeader;

    // Allow index.html to override the user photo once backend responds
    window.setHeaderUserPhoto = function (url) {
      var pEl = document.getElementById('userHeaderPhoto');
      var fEl = document.getElementById('userHeaderFallback');
      if (!pEl || !url) return;
      pEl.src = url;
      pEl.style.display = 'block';
      if (fEl) fEl.style.display = 'none';
    };

    window.navigateToProfile = navigateToProfile;
  })();
</script>
