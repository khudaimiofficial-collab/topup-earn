<!-- ================= DYNAMIC BOT & USER HEADER ================= -->
<style>
  .app-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #0f172a;
    padding: 10px 14px;
    border-radius: 20px;
    border: 1px solid rgba(56, 189, 248, 0.25);
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6), 0 0 15px rgba(56, 189, 248, 0.12);
    margin-bottom: 14px;
    width: 100%;
    user-select: none;
  }

  .header-brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .brand-avatar-box {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    overflow: hidden;
    border: 1.5px solid #38bdf8;
    box-shadow: 0 0 12px rgba(56, 189, 248, 0.45);
    display: flex;
    align-items: center;
    justify-content: center;
    background: #1e293b;
    flex-shrink: 0;
  }

  .brand-avatar-box img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .brand-text h1 {
    font-size: 14px;
    font-weight: 800;
    color: #38bdf8;
    letter-spacing: -0.2px;
    margin: 0;
    text-shadow: 0 0 8px rgba(56, 189, 248, 0.4);
    line-height: 1.2;
    max-width: 140px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .brand-text span {
    font-size: 10px;
    color: #94a3b8;
    display: block;
  }

  .header-user {
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(255, 255, 255, 0.05);
    padding: 5px 10px 5px 6px;
    border-radius: 24px;
    border: 1px solid rgba(255, 255, 255, 0.08);
    cursor: pointer;
    transition: transform 0.15s ease;
    -webkit-tap-highlight-color: transparent;
  }

  .header-user:active { transform: scale(0.95); }

  .user-avatar-wrap {
    position: relative;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .user-avatar-img {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
    border: 1.5px solid #38bdf8;
    display: none;
    background: #1e293b;
  }

  .user-avatar-fallback {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: linear-gradient(135deg, #38bdf8, #2563eb);
    color: #fff;
    font-size: 14px;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1.5px solid #38bdf8;
  }

  .status-dot-badge {
    position: absolute;
    bottom: -1px;
    right: -1px;
    width: 9px;
    height: 9px;
    background: #22c55e;
    border: 1.5px solid #0f172a;
    border-radius: 50%;
    box-shadow: 0 0 6px #22c55e;
  }

  .user-info-text {
    display: flex;
    flex-direction: column;
    text-align: left;
  }

  .user-name-text {
    font-size: 12px;
    font-weight: 700;
    color: #fff;
    max-width: 80px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    line-height: 1.2;
  }

  .user-sub-text {
    font-size: 9px;
    color: #22c55e;
    font-weight: 800;
    text-transform: uppercase;
  }
</style>

<header class="app-header">
  <!-- Bot Info Left -->
  <div class="header-brand">
    <div class="brand-avatar-box">
      <img id="botHeaderPhoto" 
           src="https://t.me/i/userpic/320/AdBoostEarningBot.jpg" 
           alt="Bot" 
           onerror="this.style.display='none'; document.getElementById('botFallbackIcon').style.display='block';" />
      <span id="botFallbackIcon" style="display:none; font-size:20px;">⚡</span>
    </div>
    <div class="brand-text">
      <!-- Synced to match 'Free Gram Token' from your MiniApp bar -->
      <h1 id="botTitle">Free Gram Token</h1>
      <span>Instant Auto Payout</span>
    </div>
  </div>

  <!-- User Profile Right -->
  <div class="header-user" onclick="navigateToProfile(event)">
    <div class="user-avatar-wrap">
      <img id="userHeaderPhoto" class="user-avatar-img" src="" alt="User" />
      <div id="userHeaderFallback" class="user-avatar-fallback">K</div>
      <span class="status-dot-badge"></span>
    </div>

    <div class="user-info-text">
      <span class="user-name-text" id="userName">Khudaimi</span>
      <span class="user-sub-text">ACTIVE</span>
    </div>
  </div>
</header>

<script>
  // Immediate Self-Executing Hydration
  (function updateHeaderData() {
    const tg = window.Telegram?.WebApp;
    const tgUser = tg?.initDataUnsafe?.user;

    const nameEl = document.getElementById('userName');
    const photoEl = document.getElementById('userHeaderPhoto');
    const fallbackEl = document.getElementById('userHeaderFallback');
    const botTitleEl = document.getElementById('botTitle');

    // 1. Force the title to match your bot name
    if (botTitleEl) {
      botTitleEl.innerText = "Free Gram Token";
    }

    // 2. Hydrate User Name and Photo from Telegram WebApp
    if (tgUser) {
      if (tgUser.first_name && nameEl) {
        nameEl.innerText = tgUser.first_name;
      }

      if (fallbackEl) {
        fallbackEl.innerText = (tgUser.first_name || 'K').charAt(0).toUpperCase();
      }

      // Check if Telegram provided the official user photo URL
      if (tgUser.photo_url && photoEl) {
        photoEl.src = tgUser.photo_url;
        photoEl.style.display = 'block';
        if (fallbackEl) fallbackEl.style.display = 'none';
      }
    }
  })();

  function navigateToProfile(e) {
    if (e) e.preventDefault();
    window.Telegram?.WebApp?.HapticFeedback?.impactOccurred('light');
    if (typeof window.navigateSpa === 'function') {
      window.navigateSpa('/profile.html');
    } else {
      window.location.href = '/profile.html';
    }
  }
</script>
