<!-- ================= HEADER COMPONENT ================= -->
<style>
  .app-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #131b2e;
    padding: 12px 16px;
    border-radius: 16px;
    border: 1px solid rgba(255, 255, 255, 0.08);
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    margin-bottom: 14px;
    width: 100%;
  }

  .header-brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .brand-icon {
    font-size: 22px;
    background: rgba(56, 189, 248, 0.12);
    padding: 6px 10px;
    border-radius: 12px;
    border: 1px solid rgba(56, 189, 248, 0.25);
  }

  .brand-text h1 {
    font-size: 14px;
    font-weight: 800;
    color: #38bdf8;
    letter-spacing: -0.2px;
    margin: 0;
  }

  .brand-text span {
    font-size: 11px;
    color: #94a3b8;
  }

  .header-user {
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(255, 255, 255, 0.05);
    padding: 6px 12px;
    border-radius: 20px;
    border: 1px solid rgba(255, 255, 255, 0.08);
    cursor: pointer;
  }

  .status-dot {
    width: 8px;
    height: 8px;
    background: #22c55e;
    border-radius: 50%;
    box-shadow: 0 0 8px #22c55e;
  }

  .user-name {
    font-size: 12px;
    font-weight: 700;
    color: #fff;
    max-width: 100px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
</style>

<header class="app-header">
  <div class="header-brand">
    <div class="brand-icon">💎</div>
    <div class="brand-text">
      <h1>Free Top-Up</h1>
      <span>automaticgametopup.iceiy.com</span>
    </div>
  </div>

  <div class="header-user" onclick="openProfileModal()">
    <span class="status-dot"></span>
    <span class="user-name" id="userName">Gamer</span>
  </div>
</header>
