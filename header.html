<!-- ================= DYNAMIC BOT & USER HEADER ================= -->
<style>
  .app-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #0f172a;
    padding: 10px 14px;
    border-radius: 20px;
    border: 1px solid rgba(56, 189, 248, 0.25);
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6), 0 0 15px rgba(56, 189, 248, 0.12);
    margin-bottom: 14px;
    width: 100%;
    user-select: none;
  }

  .header-brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .brand-avatar-box {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: linear-gradient(135deg, rgba(56, 189, 248, 0.2), rgba(37, 99, 235, 0.2));
    border: 1.5px solid #38bdf8;
    box-shadow: 0 0 12px rgba(56, 189, 248, 0.45);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 19px;
    flex-shrink: 0;
  }

  .brand-text h1 {
    font-size: 14px;
    font-weight: 800;
    color: #38bdf8;
    letter-spacing: -0.2px;
    margin: 0;
    text-shadow: 0 0 8px rgba(56, 189, 248, 0.4);
    line-height: 1.2;
    max-width: 140px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .brand-text span {
    font-size: 10.5px;
    color: #94a3b8;
    display: block;
  }

  .header-user {
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(255, 255, 255, 0.05);
    padding: 5px 10px 5px 6px;
    border-radius: 24px;
    border: 1px solid rgba(255, 255, 255, 0.08);
    cursor: pointer;
    transition: transform 0.15s ease;
    -webkit-tap-highlight-color: transparent;
  }

  .header-user:active {
    transform: scale(0.95);
  }

  .user-avatar-wrap {
    position: relative;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .user-avatar-img {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
    border: 1.5px solid #38bdf8;
    display: block;
    background: #1e293b;
  }

  .user-avatar-fallback {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: linear-gradient(135deg, #38bdf8, #2563eb);
    color: #fff;
    font-size: 14px;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1.5px solid #38bdf8;
  }

  .status-dot-badge {
    position: absolute;
    bottom: -1px;
    right: -1px;
    width: 9px;
    height: 9px;
    background: #22c55e;
    border: 1.5px solid #0f172a;
    border-radius: 50%;
    box-shadow: 0 0 6px #22c55e;
  }

  .user-info-text {
    display: flex;
    flex-direction: column;
    text-align: left;
  }

  .user-name-text {
    font-size: 12px;
    font-weight: 700;
    color: #fff;
    max-width: 80px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    line-height: 1.2;
  }

  .user-sub-text {
    font-size: 9.5px;
    color: #22c55e;
    font-weight: 700;
    text-transform: uppercase;
  }
</style>

<header class="app-header">
  <div class="header-brand">
    <div class="brand-avatar-box">⚡</div>
    <div class="brand-text">
      <h1 id="botTitle">Gram Rewards</h1>
      <span>Instant Auto Payout</span>
    </div>
  </div>

  <div class="header-user" onclick="navigateToProfile(event)">
    <div class="user-avatar-wrap">
      <img id="userHeaderPhoto" class="user-avatar-img" src="" alt="Profile" style="display: none;" onerror="showPhotoFallback()" />
      <div id="userHeaderFallback" class="user-avatar-fallback">U</div>
      <span class="status-dot-badge"></span>
    </div>

    <div class="user-info-text">
      <span class="user-name-text" id="userName">User</span>
      <span class="user-sub-text">ACTIVE</span>
    </div>
  </div>
</header>

<script>
  function showPhotoFallback() {
    const photoEl = document.getElementById('userHeaderPhoto');
    const fallbackEl = document.getElementById('userHeaderFallback');
    if (photoEl) photoEl.style.display = 'none';
    if (fallbackEl) fallbackEl.style.display = 'flex';
  }

  function navigateToProfile(e) {
    e.preventDefault();
    window.Telegram?.WebApp?.HapticFeedback?.impactOccurred('light');
    if (typeof window.navigateSpa === 'function') {
      window.navigateSpa('/profile.html');
    } else {
      window.location.href = '/profile.html';
    }
  }
</script>
