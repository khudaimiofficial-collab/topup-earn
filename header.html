<!-- ================= DYNAMIC BOT HEADER ================= -->
<style>
  .app-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #0f172a;
    padding: 10px 14px;
    border-radius: 20px;
    border: 1px solid rgba(56, 189, 248, 0.25);
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6), 0 0 15px rgba(56, 189, 248, 0.12);
    margin-bottom: 14px;
    width: 100%;
  }

  .header-brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  /* Bot Logo Avatar with Neon Glow */
  .brand-avatar-box {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    overflow: hidden;
    border: 1.5px solid #38bdf8;
    box-shadow: 0 0 12px rgba(56, 189, 248, 0.55);
    background: #1e293b;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .brand-avatar-box img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .brand-text h1 {
    font-size: 14px;
    font-weight: 800;
    color: #38bdf8;
    letter-spacing: -0.2px;
    margin: 0;
    max-width: 160px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    text-shadow: 0 0 8px rgba(56, 189, 248, 0.4);
  }

  .brand-text span {
    font-size: 10.5px;
    color: #94a3b8;
  }

  .header-user {
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(255, 255, 255, 0.05);
    padding: 6px 12px;
    border-radius: 20px;
    border: 1px solid rgba(255, 255, 255, 0.08);
    cursor: pointer;
  }

  .status-dot {
    width: 8px;
    height: 8px;
    background: #22c55e;
    border-radius: 50%;
    box-shadow: 0 0 10px #22c55e;
  }

  .user-name {
    font-size: 12px;
    font-weight: 700;
    color: #fff;
    max-width: 90px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
</style>

<header class="app-header">
  <div class="header-brand">
    <!-- Live Bot Avatar from Telegram -->
    <div class="brand-avatar-box">
      <img id="botAvatar" src="/api/bot-avatar" alt="Logo" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 100 100\'%3E%3Ctext y=\'.9em\' font-size=\'90\'%3E💎%3C/text%3E%3C/svg%3E'" />
    </div>

    <div class="brand-text">
      <!-- Live Bot Title from Telegram -->
      <h1 id="botTitle">AdBoost Earning</h1>
      <span>automaticgametopup.iceiy.com</span>
    </div>
  </div>

  <div class="header-user" onclick="location.href='/profile.html'">
    <span class="status-dot"></span>
    <span class="user-name" id="userName">Gamer</span>
  </div>
</header>

<script>
  // Instantly apply cached title if already loaded
  const cachedTitle = sessionStorage.getItem('bot_name');
  if (cachedTitle) {
    const t = document.getElementById('botTitle');
    if (t) t.innerText = cachedTitle;
  }
</script>
