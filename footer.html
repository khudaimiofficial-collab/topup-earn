<!-- ================= GLOWING FOOTER COMPONENT ================= -->
<style>
  .footer-info {
    text-align: center;
    color: #94a3b8;
    font-size: 11px;
    margin: 20px 0 105px 0;
    line-height: 1.6;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }

  .partner-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.07);
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 11px;
    color: #cbd5e1;
  }

  .partner-pill b { color: #38bdf8; }

  /* Floating Dock */
  .dock-wrapper {
    position: fixed;
    bottom: 14px;
    left: 0;
    right: 0;
    display: flex;
    justify-content: center;
    z-index: 999;
    padding: 0 14px calc(env(safe-area-inset-bottom, 0px));
    pointer-events: none;
  }

  .bottom-dock {
    pointer-events: auto;
    width: 100%;
    max-width: 400px;
    background: #0b1121;
    border: 1px solid rgba(56, 189, 248, 0.3);
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.8), 0 0 20px rgba(56, 189, 248, 0.15);
    border-radius: 32px;
    padding: 6px 10px;
    display: flex;
    justify-content: space-around;
    align-items: center;
  }

  .dock-tab {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    flex: 1;
    padding: 6px 0;
    text-decoration: none;
    color: #64748b;
    -webkit-tap-highlight-color: transparent;
    transition: transform 0.15s ease;
  }

  .dock-tab:active { transform: scale(0.88); }

  /* Telegram Hardware-Accelerated Neon Glow */
  .icon-halo {
    position: relative;
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    transform: translateZ(0);
    transition: all 0.2s ease;
  }

  .icon-halo svg {
    width: 22px;
    height: 22px;
    fill: #64748b;
    transition: fill 0.2s ease;
  }

  .tab-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.3px;
    margin-top: 3px;
    color: #64748b;
    transition: color 0.2s ease;
  }

  /* --- GUARANTEED TELEGRAM GLOW --- */
  .dock-tab.active .icon-halo {
    background: rgba(56, 189, 248, 0.22);
    box-shadow: 0 0 16px #38bdf8, inset 0 0 8px #38bdf8;
    border: 1px solid #38bdf8;
    transform: translateY(-2px) translateZ(0);
  }

  .dock-tab.active .icon-halo svg {
    fill: #38bdf8;
  }

  .dock-tab.active .tab-label {
    color: #38bdf8;
    font-weight: 800;
    text-shadow: 0 0 10px rgba(56, 189, 248, 0.9);
  }
</style>

<footer class="footer-info">
  <div class="partner-pill">
    <span>Partner of <b>automaticgametopup.iceiy.com</b></span>
  </div>
  <span style="font-size: 10px; color: #64748b;">Instant • Verified • Automated Credits</span>
</footer>

<div class="dock-wrapper">
  <nav class="bottom-dock">
    <!-- 1. Earn -->
    <a href="/index.html" class="dock-tab" id="tab-earn" onclick="tabHaptic()">
      <div class="icon-halo">
        <svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
      </div>
      <span class="tab-label">Earn</span>
    </a>

    <!-- 2. Withdraw -->
    <a href="/withdraw.html" class="dock-tab" id="tab-withdraw" onclick="tabHaptic()">
      <div class="icon-halo">
        <svg viewBox="0 0 24 24"><path d="M21 18v1c0 1.1-.9 2-2 2H5c-1.11 0-2-.9-2-2V5c0-1.1.89-2 2-2h14c1.1 0 2 .9 2 2v1h-9c-1.11 0-2 .9-2 2v8c0 1.1.89 2 2 2h9zm-9-2h10V8H12v8zm4-2.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>
      </div>
      <span class="tab-label">Withdraw</span>
    </a>

    <!-- 3. Invite -->
    <a href="/invite.html" class="dock-tab" id="tab-invite" onclick="tabHaptic()">
      <div class="icon-halo">
        <svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
      </div>
      <span class="tab-label">Invite</span>
    </a>

    <!-- 4. Profile -->
    <a href="/profile.html" class="dock-tab" id="tab-profile" onclick="tabHaptic()">
      <div class="icon-halo">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg>
      </div>
      <span class="tab-label">Profile</span>
    </a>
  </nav>
</div>

<script>
  function tabHaptic() {
    window.Telegram?.WebApp?.HapticFeedback?.impactOccurred('light');
  }

  // Active Glow Detection
  const path = window.location.pathname;
  document.querySelectorAll('.dock-tab').forEach(t => t.classList.remove('active'));

  if (path.includes('withdraw')) {
    document.getElementById('tab-withdraw')?.classList.add('active');
  } else if (path.includes('invite')) {
    document.getElementById('tab-invite')?.classList.add('active');
  } else if (path.includes('profile')) {
    document.getElementById('tab-profile')?.classList.add('active');
  } else {
    document.getElementById('tab-earn')?.classList.add('active');
  }

  // Instant prefetch other pages in the background
  ['/index.html', '/withdraw.html', '/invite.html', '/profile.html'].forEach(url => {
    if (!path.includes(url)) fetch(url);
  });
</script>
