    padding: 6px 0;

    transition: color 0.15s ease;

<script>
  // Highlight active tab dynamically based on current URL
  const cur = window.location.pathname;
  document.querySelectorAll('.nav-tab').forEach(el => el.classList.remove('active'));
  if (cur.includes('withdraw')) {
    document.getElementById('tab-withdraw')?.classList.add('active');
  } else if (cur.includes('invite')) {
    document.getElementById('tab-invite')?.classList.add('active');
  } else if (cur.includes('profile')) {
    document.getElementById('tab-profile')?.classList.add('active');
  } else {
    document.getElementById('tab-earn')?.classList.add('active');
  }
</script>
