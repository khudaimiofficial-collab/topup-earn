<!-- ================= COOL FLOATING DOCK FOOTER ================= -->
<style>
  /* Footer Partner Badge */
  .footer-info {
    text-align: center;
    color: #94a3b8;
    font-size: 11px;
    margin: 20px 0 100px 0;
    line-height: 1.6;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }

  .partner-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.07);
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 11px;
    color: #cbd5e1;
  }

  .partner-pill b {
    color: #38bdf8;
    font-weight: 700;
  }

  .pulse-dot {
    width: 6px;
    height: 6px;
    background: #38bdf8;
    border-radius: 50%;
    box-shadow: 0 0 8px #38bdf8;
    animation: pulseGlow 2s infinite;
  }

  @keyframes pulseGlow {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.85); }
  }

  /* ============================================================
     FLOATING CYBER GLASS DOCK
  ============================================================ */
  .dock-wrapper {
    position: fixed;
    bottom: 12px;
    left: 0;
    right: 0;
    display: flex;
    justify-content: center;
    z-index: 999;
    padding: 0 14px calc(env(safe-area-inset-bottom, 0px));
    pointer-events: none; /* Allows tapping background edges */
  }

  .bottom-dock {
    pointer-events: auto;
    width: 100%;
    max-width: 390px;
    background: rgba(15, 23, 42, 0.82);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.12);
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6), 0 0 20px rgba(56, 189, 248, 0.12);
    border-radius: 30px;
    padding: 6px 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: relative;
  }

  /* Individual Tab */
  .dock-tab {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    flex: 1;
    padding: 7px 0;
    text-decoration: none;
    color: #94a3b8;
    border-radius: 20px;
    transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    -webkit-tap-highlight-color: transparent;
  }

  .dock-tab:active {
    transform: scale(0.88);
  }

  /* Icon Container */
  .icon-box {
    position: relative;
    width: 24px;
    height: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.25s ease;
  }

  .icon-box svg {
    width: 22px;
    height: 22px;
    fill: currentColor;
    transition: all 0.25s ease;
  }

  /* Tab Label */
  .tab-label {
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.3px;
    margin-top: 3px;
    transition: color 0.2s ease, transform 0.2s ease;
  }

  /* ============================================================
     ACTIVE STATE & NEON GLOW
  ============================================================ */
  .dock-tab.active {
    color: #38bdf8;
  }

  .dock-tab.active .icon-box {
    transform: translateY(-2px);
  }

  .dock-tab.active .icon-box svg {
    filter: drop-shadow(0 0 10px rgba(56, 189, 248, 0.85));
  }

  .dock-tab.active .tab-label {
    color: #ffffff;
    font-weight: 800;
  }

  /* Floating Neon Indicator Dot under active tab */
  .dock-tab.active::after {
    content: '';
    position: absolute;
    bottom: 2px;
    width: 14px;
    height: 3px;
    background: linear-gradient(90deg, #38bdf8, #818cf8);
    border-radius: 10px;
    box-shadow: 0 0 10px #38bdf8;
    animation: glowBar 1.5s infinite alternate;
  }

  @keyframes glowBar {
    from { opacity: 0.7; box-shadow: 0 0 6px #38bdf8; }
    to { opacity: 1; box-shadow: 0 0 14px #38bdf8; }
  }
</style>

<!-- Partner Footer Text -->
<footer class="footer-info">
  <div class="partner-pill">
    <span class="pulse-dot"></span>
    <span>Partner of <b>automaticgametopup.iceiy.com</b></span>
  </div>
  <span style="font-size: 10px; color: #64748b;">Instant • Verified • Automated Credits</span>
</footer>

<!-- Floating Cyber Glass Dock -->
<div class="dock-wrapper">
  <nav class="bottom-dock">
    
    <!-- 1. EARN -->
    <a href="/index.html" class="dock-tab" id="tab-earn" onclick="tabHaptic()">
      <div class="icon-box">
        <svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
      </div>
      <span class="tab-label">Earn</span>
    </a>

    <!-- 2. WITHDRAW -->
    <a href="/withdraw.html" class="dock-tab" id="tab-withdraw" onclick="tabHaptic()">
      <div class="icon-box">
        <svg viewBox="0 0 24 24"><path d="M21 18v1c0 1.1-.9 2-2 2H5c-1.11 0-2-.9-2-2V5c0-1.1.89-2 2-2h14c1.1 0 2 .9 2 2v1h-9c-1.11 0-2 .9-2 2v8c0 1.1.89 2 2 2h9zm-9-2h10V8H12v8zm4-2.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>
      </div>
      <span class="tab-label">Withdraw</span>
    </a>

    <!-- 3. INVITE -->
    <a href="/invite.html" class="dock-tab" id="tab-invite" onclick="tabHaptic()">
      <div class="icon-box">
        <svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
      </div>
      <span class="tab-label">Invite</span>
    </a>

    <!-- 4. PROFILE -->
    <a href="/profile.html" class="dock-tab" id="tab-profile" onclick="tabHaptic()">
      <div class="icon-box">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg>
      </div>
      <span class="tab-label">Profile</span>
    </a>

  </nav>
</div>

<script>
  // Trigger light vibration on button press (Telegram Haptics)
  function tabHaptic() {
    if (window.Telegram?.WebApp?.HapticFeedback) {
      window.Telegram.WebApp.HapticFeedback.impactOccurred('light');
    }
  }

  // Detect and highlight the current active tab
  const cur = window.location.pathname;
  document.querySelectorAll('.dock-tab').forEach(el => el.classList.remove('active'));
  
  if (cur.includes('withdraw')) {
    document.getElementById('tab-withdraw')?.classList.add('active');
  } else if (cur.includes('invite')) {
    document.getElementById('tab-invite')?.classList.add('active');
  } else if (cur.includes('profile')) {
    document.getElementById('tab-profile')?.classList.add('active');
  } else {
    document.getElementById('tab-earn')?.classList.add('active');
  }
</script>
