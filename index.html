<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Free Top-Up & Game Credits</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://libtl.com/sdk.js" data-zone="11862560" data-sdk="show_11862560"></script>
  <style>
    :root {
      --bg: #090d16;
      --card: #131b2e;
      --accent: #38bdf8;
      --btn-bg: #22c55e;
      --text: #ffffff;
      --text-dim: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 16px; }
    .container { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 14px; }
    .brand-header { display: flex; justify-content: space-between; align-items: center; background: var(--card); padding: 12px 16px; border-radius: 14px; border: 1px solid rgba(255, 255, 255, 0.05); }
    .brand-title { font-size: 15px; font-weight: 800; color: var(--accent); }
    .card { background: var(--card); padding: 24px 20px; border-radius: 18px; text-align: center; border: 1px solid rgba(255, 255, 255, 0.05); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); }
    .balance-label { color: var(--text-dim); font-size: 13px; text-transform: uppercase; font-weight: 600; }
    .balance-value { font-size: 44px; font-weight: 900; color: #ffffff; margin: 8px 0; }
    .badge-row { display: flex; justify-content: center; gap: 8px; font-size: 12px; color: var(--text-dim); }
    .badge { background: rgba(255, 255, 255, 0.05); padding: 4px 10px; border-radius: 20px; }
    .btn { width: 100%; padding: 16px; border-radius: 14px; border: none; font-size: 16px; font-weight: 800; cursor: pointer; transition: transform 0.1s ease; }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-watch { background: var(--btn-bg); color: #052e16; }
    .btn-withdraw { background: rgba(255, 255, 255, 0.08); color: var(--text); }
    .btn-website { background: #2563eb; color: #ffffff; margin-top: 4px; font-size: 14px; padding: 13px; }
    .overlay { display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.9); z-index: 1000; justify-content: center; align-items: center; padding: 20px; }
    .modal-box { background: var(--card); width: 100%; max-width: 340px; padding: 24px; border-radius: 16px; text-align: center; border: 1px solid rgba(255, 255, 255, 0.1); }
    .input-field { width: 100%; padding: 13px; border-radius: 10px; border: 1px solid rgba(255, 255, 255, 0.2); background: rgba(0, 0, 0, 0.3); color: #fff; font-size: 14px; margin: 15px 0 10px 0; outline: none; }
    .countdown { font-size: 50px; font-weight: 900; color: #facc15; margin: 15px 0; }
  </style>
</head>
<body>

  <div class="container">
    <div class="brand-header">
      <div class="brand-title">💎 Free Top-Up & Credits</div>
      <div id="userName" style="font-size: 13px; color: var(--text-dim);">Gamer</div>
    </div>

    <div class="card">
      <div class="balance-label">Available Points</div>
      <div class="balance-value">
        <span id="balance">0.00</span>
        <span style="font-size: 20px; color: var(--accent);">PTS</span>
      </div>

      <div class="badge-row">
        <span class="badge">Reward: +10.00 PTS</span>
        <span class="badge" id="adsWatchedCount">0 Ads Watched</span>
      </div>
    </div>

    <button class="btn btn-watch" id="adBtn" onclick="triggerAd()">▶ Watch Ad (+10 PTS)</button>
    <button class="btn btn-withdraw" onclick="openWithdrawModal()">Withdraw to Website Account</button>
    <button class="btn btn-website" onclick="openWebsite()">🌐 Open automaticgametopup.iceiy.com</button>
  </div>

  <div class="overlay" id="adModal">
    <div class="modal-box">
      <h3>Displaying Advertisement</h3>
      <p style="font-size: 12px; color: var(--text-dim); margin-top: 5px;">Sponsored Promotion</p>
      <div class="countdown" id="adTimer">5</div>
      <p style="font-size: 12px; color: var(--text-dim);">Please wait to claim your reward...</p>
    </div>
  </div>

  <div class="overlay" id="withdrawModal">
    <div class="modal-box">
      <h3>Withdraw to Account</h3>
      <p style="font-size: 13px; color: var(--text-dim); margin-top: 6px;">
        Enter your registered email on <b>automaticgametopup.iceiy.com</b>:
      </p>
      <input type="email" id="accountEmail" class="input-field" placeholder="your-email@example.com" />
      <button class="btn btn-watch" id="withdrawSubmitBtn" onclick="processWithdrawal()">Submit Withdrawal</button>
      <button class="btn" style="background: transparent; color: var(--text-dim); margin-top: 6px;" onclick="closeModal()">Cancel</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    const user = tg?.initDataUnsafe?.user || {
      id: "demo_guest_user",
      first_name: "Guest",
      username: "guest"
    };

    if (user?.first_name) {
      document.getElementById('userName').innerText = user.first_name;
    }

    let currentBalance = 0.00;
    const MIN_WITHDRAW_POINTS = 50.00;

    function loadUserData() {
      fetch('/api/get-user', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          telegram_id: user.id,
          first_name: user.first_name,
          username: user.username
        })
      })
      .then(res => res.json())
      .then(data => {
        if (data.status === 'success') {
          currentBalance = parseFloat(data.balance);
          document.getElementById('balance').innerText = currentBalance.toFixed(2);
          document.getElementById('adsWatchedCount').innerText = `${data.ads_watched} Ads Watched`;
        }
      })
      .catch(err => console.error("Error loading user profile:", err));
    }
    loadUserData();

    function giveReward() {
      const btn = document.getElementById('adBtn');
      btn.disabled = true;
      btn.innerText = "Syncing reward...";

      fetch('/api/reward', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          telegram_id: user.id,
          first_name: user.first_name,
          username: user.username
        })
      })
      .then(res => res.json())
      .then(data => {
        if (data.status === 'success') {
          currentBalance = parseFloat(data.balance);
          document.getElementById('balance').innerText = currentBalance.toFixed(2);
          document.getElementById('adsWatchedCount').innerText = `${data.ads_watched} Ads Watched`;

          tg?.HapticFeedback?.notificationOccurred('success');
          alert("🎉 +10.00 Points credited to your account!");
        } else {
          alert(data.message || "Could not save reward.");
        }
      })
      .catch(err => {
        console.error(err);
        alert("Failed to connect to reward server.");
      })
      .finally(() => {
        btn.disabled = false;
        btn.innerText = "▶ Watch Ad (+10 PTS)";
      });
    }

    function triggerAd() {
      const btn = document.getElementById('adBtn');
      btn.innerText = "Loading ad...";
      btn.disabled = true;

      if (typeof window.show_11862560 === 'function') {
        window.show_11862560()
          .then(() => giveReward())
          .catch(() => runFallbackAd());
      } else {
        runFallbackAd();
      }
    }

    function runFallbackAd() {
      const modal = document.getElementById('adModal');
      const timerDisplay = document.getElementById('adTimer');
      let count = 5;

      modal.style.display = 'flex';
      timerDisplay.innerText = count;

      const interval = setInterval(() => {
        count--;
        timerDisplay.innerText = count;
        if (count <= 0) {
          clearInterval(interval);
          modal.style.display = 'none';
          giveReward();
        }
      }, 1000);
    }

    function openWithdrawModal() {
      if (currentBalance < MIN_WITHDRAW_POINTS) {
        alert(`Minimum withdrawal is ${MIN_WITHDRAW_POINTS.toFixed(2)} Points.`);
        return;
      }
      document.getElementById('withdrawModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('withdrawModal').style.display = 'none';
    }

    function openWebsite() {
      if (tg?.openLink) {
        tg.openLink("https://automaticgametopup.iceiy.com");
      } else {
        window.open("https://automaticgametopup.iceiy.com", "_blank");
      }
    }

    function processWithdrawal() {
      const emailInput = document.getElementById('accountEmail');
      const email = emailInput.value.trim();
      const submitBtn = document.getElementById('withdrawSubmitBtn');
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

      if (!email || !emailRegex.test(email)) {
        alert("Please enter a valid email address.");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerText = "Submitting...";

      fetch('/api/withdraw', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          telegram_id: user.id,
          email: email
        })
      })
      .then(res => res.json())
      .then(data => {
        if (data.status === 'success') {
          currentBalance = 0.00;
          document.getElementById('balance').innerText = "0.00";
          emailInput.value = "";
          closeModal();
          alert(`Withdrawal submitted for ${data.points} PTS! Check status on the website.`);
        } else {
          alert(data.message || "Failed to submit withdrawal.");
        }
      })
      .catch(err => {
        console.error(err);
        alert("Server error processing withdrawal.");
      })
      .finally(() => {
        submitBtn.disabled = false;
        submitBtn.innerText = "Submit Withdrawal";
      });
    }
  </script>
</body>
</html>
