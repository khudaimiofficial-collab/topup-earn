<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Earn - Free Top-Up</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://libtl.com/sdk.js" data-zone="11862560" data-sdk="show_11862560"></script>
  <style>
    :root {
      --bg: #070a12;
      --card: #0f172a;
      --card-border: rgba(56, 189, 248, 0.12);
      --accent: #38bdf8;
      --text: #ffffff;
      --text-dim: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 12px 14px 90px 14px; }
    .container { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 14px; }
    .card { background: var(--card); padding: 22px 18px; border-radius: 20px; border: 1px solid var(--card-border); box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6); text-align: center; }
    .balance-label { color: var(--text-dim); font-size: 12px; text-transform: uppercase; font-weight: 700; letter-spacing: 0.8px; }
    .balance-value { font-size: 46px; font-weight: 900; color: #ffffff; margin: 8px 0; display: flex; justify-content: center; align-items: baseline; gap: 6px; }
    .balance-pts { font-size: 20px; color: var(--accent); font-weight: 800; text-shadow: 0 0 10px rgba(56, 189, 248, 0.6); }
    .badge-row { display: flex; justify-content: center; gap: 8px; font-size: 12px; color: var(--text-dim); margin-top: 4px; }
    .badge { background: rgba(255, 255, 255, 0.05); padding: 6px 12px; border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.05); font-weight: 600; }
    .btn { width: 100%; padding: 16px; border-radius: 14px; border: none; font-size: 15px; font-weight: 800; cursor: pointer; transition: transform 0.1s ease; }
    .btn:active { transform: scale(0.97); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-watch { background: linear-gradient(135deg, #22c55e, #16a34a); color: #052e16; box-shadow: 0 4px 20px rgba(34, 197, 94, 0.35); }
    .btn-withdraw { background: rgba(255, 255, 255, 0.08); color: var(--text); border: 1px solid var(--card-border); }
    .store-card { background: linear-gradient(135deg, #131b2e, #1e1b4b); padding: 16px; border-radius: 16px; border: 1px solid rgba(56, 189, 248, 0.25); display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
    .store-info h4 { font-size: 14px; color: #fff; margin-bottom: 2px; }
    .store-info p { font-size: 11px; color: #94a3b8; }
    .store-arrow { font-size: 20px; color: var(--accent); }
    .overlay { display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.92); z-index: 1000; justify-content: center; align-items: center; padding: 20px; }
    .modal-box { background: var(--card); width: 100%; max-width: 340px; padding: 24px; border-radius: 18px; text-align: center; border: 1px solid var(--card-border); }
    .countdown { font-size: 52px; font-weight: 900; color: #facc15; margin: 15px 0; }
  </style>
</head>
<body>

  <div class="container">
    <div id="header-container"></div>

    <div class="card">
      <div class="balance-label">Available Points</div>
      <div class="balance-value">
        <span id="balance">0.00</span>
        <span class="balance-pts">PTS</span>
      </div>

      <div class="badge-row">
        <span class="badge">Reward: +10.00 PTS</span>
        <span class="badge" id="adsWatchedCount">0 Ads Watched</span>
      </div>
    </div>

    <button class="btn btn-watch" id="adBtn" onclick="triggerAd()">
      ▶ Watch Ad (+10.00 PTS)
    </button>

    <button class="btn btn-withdraw" onclick="location.href='/withdraw.html'">
      💳 Request Top-Up Withdrawal
    </button>

    <div class="store-card" onclick="openWebsite()">
      <div class="store-info">
        <h4>🛒 Automated Top-Up Store</h4>
        <p>Instant Game Credits, UC, Diamonds & Passes</p>
      </div>
      <div class="store-arrow">➔</div>
    </div>

    <div id="footer-container"></div>
  </div>

  <div class="overlay" id="adModal">
    <div class="modal-box">
      <h3 style="color:#fff;">Displaying Advertisement</h3>
      <p style="font-size: 12px; color: var(--text-dim); margin-top: 5px;">Sponsored Promotion</p>
      <div class="countdown" id="adTimer">5</div>
      <p style="font-size: 12px; color: var(--text-dim);">Please wait to claim your reward...</p>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (!tg?.initData || tg.initData.length === 0) {
      document.body.innerHTML = `<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;background:#090d16;color:#fff;"><h2 style="color:#38bdf8;">Telegram Access Only</h2><p style="color:#94a3b8;margin:15px 0;">This app is exclusively available inside Telegram.</p><a href="https://t.me/AdBoostEarningBot" style="background:#2563eb;color:#fff;text-decoration:none;padding:14px 28px;border-radius:12px;font-weight:bold;">🚀 Open @AdBoostEarningBot</a></div>`;
      throw new Error("Access Denied");
    }

    tg.ready();
    tg.expand();
    tg.BackButton.hide();

    const user = tg.initDataUnsafe?.user || { id: "0", first_name: "Gamer" };
    let currentBalance = 0.00;

    // Load Header & Footer
    fetch('/header.html').then(r => r.text()).then(html => {
      document.getElementById('header-container').innerHTML = html;
      if (user?.first_name) {
        const el = document.getElementById('userName');
        if (el) el.innerText = user.first_name;
      }
    });
    fetch('/footer.html').then(r => r.text()).then(html => {
      document.getElementById('footer-container').innerHTML = html;
      // Re-run glow activation after injection
      const s = document.createElement('script');
      s.text = html.match(/<script>([\s\S]*?)<\/script>/)?.[1] || '';
      document.body.appendChild(s);
    });

    function loadUserData() {
      fetch('/api/get-user', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ telegram_id: user.id, first_name: user.first_name, username: user.username })
      })
      .then(r => r.json())
      .then(data => {
        if (data.status === 'success') {
          currentBalance = parseFloat(data.balance);
          document.getElementById('balance').innerText = currentBalance.toFixed(2);
          document.getElementById('adsWatchedCount').innerText = `${data.ads_watched} Ads Watched`;
        }
      });
    }
    loadUserData();

    function giveReward() {
      const btn = document.getElementById('adBtn');
      btn.disabled = true;
      btn.innerText = "Syncing reward...";

      fetch('/api/reward', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ telegram_id: user.id, first_name: user.first_name, username: user.username })
      })
      .then(r => r.json())
      .then(data => {
        if (data.status === 'success') {
          currentBalance = parseFloat(data.balance);
          document.getElementById('balance').innerText = currentBalance.toFixed(2);
          document.getElementById('adsWatchedCount').innerText = `${data.ads_watched} Ads Watched`;
          tg.HapticFeedback?.notificationOccurred('success');
          alert("🎉 +10.00 Points credited!");
        } else {
          alert(data.message || "Error");
        }
      })
      .finally(() => {
        btn.disabled = false;
        btn.innerText = "▶ Watch Ad (+10.00 PTS)";
      });
    }

    function triggerAd() {
      const btn = document.getElementById('adBtn');
      btn.innerText = "Loading ad...";
      btn.disabled = true;

      if (typeof window.show_11862560 === 'function') {
        window.show_11862560().then(() => giveReward()).catch(() => runFallbackAd());
      } else {
        runFallbackAd();
      }
    }

    function runFallbackAd() {
      const modal = document.getElementById('adModal');
      const timerDisplay = document.getElementById('adTimer');
      let count = 5;

      modal.style.display = 'flex';
      timerDisplay.innerText = count;

      const interval = setInterval(() => {
        count--;
        timerDisplay.innerText = count;
        if (count <= 0) {
          clearInterval(interval);
          modal.style.display = 'none';
          giveReward();
        }
      }, 1000);
    }

    function openWebsite() {
      if (tg.openLink) {
        tg.openLink("https://automaticgametopup.iceiy.com");
      } else {
        window.open("https://automaticgametopup.iceiy.com", "_blank");
      }
    }
  </script>
</body>
</html>
