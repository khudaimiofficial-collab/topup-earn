<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Invite - Free Top-Up</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #070a12;
      --card: #0f172a;
      --card-border: rgba(56, 189, 248, 0.12);
      --accent: #38bdf8;
      --text: #ffffff;
      --text-dim: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 12px 14px 90px 14px; }
    .container { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 14px; }
    .card { background: var(--card); padding: 22px 18px; border-radius: 20px; border: 1px solid var(--card-border); box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6); text-align: center; }
    .input-field { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.2); background: rgba(0, 0, 0, 0.45); color: #38bdf8; font-size: 13px; font-weight: 700; text-align: center; margin: 12px 0 16px 0; outline: none; }
    .btn { width: 100%; padding: 15px; border-radius: 14px; border: none; font-size: 15px; font-weight: 800; cursor: pointer; margin-bottom: 8px; }
    .btn:active { transform: scale(0.97); }
    .btn-blue { background: linear-gradient(135deg, #38bdf8, #2563eb); color: #fff; box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3); }
    .btn-copy { background: rgba(255, 255, 255, 0.08); color: #fff; border: 1px solid var(--card-border); }
  </style>
</head>
<body>

  <div class="container">
    <div id="header-container"></div>

    <div class="card">
      <div style="font-size: 46px; margin-bottom: 8px;">🎁</div>
      <h2 style="font-size: 20px; color: #fff;">Invite Friends & Earn</h2>
      <p style="font-size: 12px; color: var(--text-dim); margin-top: 4px;">
        Share your referral link with gamers to earn free credits together!
      </p>

      <input type="text" id="inviteLinkInput" class="input-field" readonly />

      <button class="btn btn-blue" onclick="shareInvite()">
        🚀 Share to Telegram Friends
      </button>

      <button class="btn btn-copy" onclick="copyInviteLink()">
        📋 Copy Referral Link
      </button>
    </div>

    <div id="footer-container"></div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (!tg?.initData || tg.initData.length === 0) {
      location.href = '/index.html';
    }
    tg.ready();
    tg.expand();
    tg.BackButton.show();
    tg.BackButton.onClick(() => { location.href = '/index.html'; });

    const user = tg.initDataUnsafe?.user || { id: "0", first_name: "Gamer" };
    const link = `https://t.me/AdBoostEarningBot?start=${user.id}`;
    document.getElementById('inviteLinkInput').value = link;

    fetch('/header.html').then(r => r.text()).then(html => {
      document.getElementById('header-container').innerHTML = html;
      if (user?.first_name) {
        const el = document.getElementById('userName');
        if (el) el.innerText = user.first_name;
      }
    });
    fetch('/footer.html').then(r => r.text()).then(html => {
      document.getElementById('footer-container').innerHTML = html;
      const s = document.createElement('script');
      s.text = html.match(/<script>([\s\S]*?)<\/script>/)?.[1] || '';
      document.body.appendChild(s);
    });

    function copyInviteLink() {
      const input = document.getElementById('inviteLinkInput');
      input.select();
      navigator.clipboard.writeText(input.value);
      alert("✅ Referral link copied!");
    }

    function shareInvite() {
      const text = encodeURIComponent("🎮 Earn free top-up & game credits with me on @AdBoostEarningBot!");
      const shareUrl = `https://t.me/share/url?url=${encodeURIComponent(link)}&text=${text}`;
      if (tg.openTelegramLink) {
        tg.openTelegramLink(shareUrl);
      } else {
        window.open(shareUrl, '_blank');
      }
    }
  </script>
</body>
</html>
