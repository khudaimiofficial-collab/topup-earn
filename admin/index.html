<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Admin Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #090d16; color: #fff; padding: 16px; min-height: 100vh; }
    .card { background: #131b2e; padding: 20px; border-radius: 14px; max-width: 900px; margin: 0 auto 20px auto; border: 1px solid rgba(255,255,255,0.08); box-shadow: 0 4px 20px rgba(0,0,0,0.4); }
    h2, h3 { color: #38bdf8; margin-bottom: 8px; }
    p { font-size: 13px; color: #94a3b8; margin-bottom: 14px; }
    .form-group { display: flex; flex-direction: column; margin-bottom: 12px; }
    label { font-size: 12px; color: #94a3b8; font-weight: 700; text-transform: uppercase; margin-bottom: 4px; }
    input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #090d16; color: #fff; font-size: 14px; outline: none; }
    input:focus { border-color: #38bdf8; }
    .btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
    button { padding: 12px 18px; border-radius: 8px; border: none; font-weight: 800; font-size: 14px; cursor: pointer; transition: transform 0.1s ease; }
    button:active { transform: scale(0.98); }
    .btn-blue { background: #38bdf8; color: #042f2e; }
    .btn-purple { background: #a855f7; color: #fff; }
    .btn-green { background: #22c55e; color: #052e16; }
    .btn-red { background: #ef4444; color: #fff; }
    .table-container { overflow-x: auto; margin-top: 14px; }
    table { width: 100%; border-collapse: collapse; min-width: 600px; }
    th, td { padding: 12px; border-bottom: 1px solid #1f293d; text-align: left; font-size: 13px; }
    th { background: rgba(0,0,0,0.3); color: #94a3b8; font-weight: 700; }
    .pending { color: #facc15; font-weight: 800; }
    .approved { color: #22c55e; font-weight: 800; }
    .rejected { color: #ef4444; font-weight: 800; }
  </style>
</head>
<body>

  <!-- Login Card -->
  <div class="card" id="authBox" style="max-width: 400px; margin-top: 40px;">
    <h2>🔐 Admin Sign In</h2>
    <p>Enter your secret admin password to unlock the dashboard:</p>
    <div class="form-group">
      <input type="password" id="adminSecret" placeholder="Admin Secret Password">
    </div>
    <button class="btn-green" style="width: 100%;" onclick="unlockDashboard()">Sign In</button>
  </div>

  <!-- Main Dashboard (Hidden until login) -->
  <div id="mainDashboard" style="display: none;">

    <!-- Settings Card -->
    <div class="card">
      <h3>⚙️ Bot & App Settings</h3>
      <p>Configure bot token, minimum withdrawal, and webhook.</p>

      <div class="form-group">
        <label>Telegram Bot Token (from @BotFather):</label>
        <input type="text" id="settingBotToken" placeholder="123456789:ABCdefGhIJKlmNoPQRsTUVwxyZ">
      </div>

      <div class="form-group">
        <label>Telegram Channel / Store Username:</label>
        <input type="text" id="settingChannelId" placeholder="@KhudaimiOfficialStore">
      </div>

      <div class="form-group">
        <label>Minimum Withdrawal Points:</label>
        <input type="number" id="settingMinWithdraw" placeholder="50.00">
      </div>

      <div class="form-group">
        <label>Top-Up Website URL:</label>
        <input type="text" id="settingWebsiteUrl" placeholder="https://automaticgametopup.iceiy.com">
      </div>

      <div class="form-group">
        <label>Start Message Banner Image Link:</label>
        <input type="text" id="settingBannerUrl" placeholder="https://images.unsplash.com/photo-1542751371-adc38448a05e?w=800&q=80">
      </div>

      <div class="btn-row">
        <button class="btn-blue" onclick="saveSettings()">💾 Save Configuration</button>
        <button class="btn-purple" onclick="activateWebhook()">⚡ Connect /start Instant Bot Messages</button>
      </div>
    </div>

    <!-- Withdrawals Card -->
    <div class="card">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <h3>📥 Withdrawal Requests</h3>
        <button class="btn-green" onclick="loadWithdrawals()">🔄 Refresh</button>
      </div>

      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Telegram ID</th>
              <th>Email</th>
              <th>Points</th>
              <th>Status</th>
              <th>Date</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="listBody"></tbody>
        </table>
      </div>
    </div>

  </div>

  <script>
    let secret = '';

    async function unlockDashboard() {
      secret = document.getElementById('adminSecret').value.trim();
      if (!secret) return alert('Please enter your password');

      try {
        const res = await fetch('/api/admin?type=settings', {
          headers: { 'x-admin-secret': secret }
        });

        if (!res.ok) return alert('Invalid Password');

        const settings = await res.json();
        document.getElementById('settingBotToken').value = settings.bot_token || '';
        document.getElementById('settingChannelId').value = settings.channel_id || '';
        document.getElementById('settingMinWithdraw').value = settings.min_withdraw || 50;
        document.getElementById('settingWebsiteUrl').value = settings.website_url || 'https://automaticgametopup.iceiy.com';
        document.getElementById('settingBannerUrl').value = settings.banner_url || '';

        document.getElementById('authBox').style.display = 'none';
        document.getElementById('mainDashboard').style.display = 'block';

        loadWithdrawals();
      } catch (err) {
        alert('Failed to connect to backend.');
      }
    }

    async function saveSettings() {
      const bot_token = document.getElementById('settingBotToken').value.trim();
      const channel_id = document.getElementById('settingChannelId').value.trim();
      const min_withdraw = document.getElementById('settingMinWithdraw').value.trim();
      const website_url = document.getElementById('settingWebsiteUrl').value.trim();
      const banner_url = document.getElementById('settingBannerUrl').value.trim();

      const res = await fetch('/api/admin', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-admin-secret': secret },
        body: JSON.stringify({
          action: 'save_settings',
          bot_token,
          channel_id,
          min_withdraw,
          website_url,
          banner_url
        })
      });

      const data = await res.json();
      if (data.success) {
        alert('✅ Settings saved successfully!');
      } else {
        alert('Failed to save settings.');
      }
    }

    async function activateWebhook() {
      if (!confirm("Activate bot webhook now?")) return;

      try {
        const res = await fetch('/api/admin', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'x-admin-secret': secret },
          body: JSON.stringify({ action: 'set_webhook' })
        });

        const data = await res.json();
        if (data.success) {
          alert('🎉 ' + data.message);
        } else {
          alert('❌ Error: ' + (data.error || 'Failed to activate webhook'));
        }
      } catch (e) {
        alert('Network error connecting to webhook service.');
      }
    }

    async function loadWithdrawals() {
      const res = await fetch('/api/admin', {
        headers: { 'x-admin-secret': secret }
      });
      const data = await res.json();

      const tbody = document.getElementById('listBody');
      if (!data.withdrawals?.length) {
        tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:#94a3b8; padding: 20px;">No withdrawal requests found.</td></tr>`;
        return;
      }

      tbody.innerHTML = data.withdrawals.map(w => `
        <tr>
          <td><code>${w.telegram_id}</code></td>
          <td>${w.email}</td>
          <td><b>${Number(w.points).toFixed(2)} PTS</b></td>
          <td class="${w.status}">${w.status.toUpperCase()}</td>
          <td style="color:#94a3b8; font-size:11px;">${new Date(w.created_at).toLocaleString()}</td>
          <td>
            ${w.status === 'pending' ? `
              <button class="btn-green" style="padding: 6px 10px; font-size: 12px;" onclick="updateStatus('${w.id}', 'approve')">Approve</button>
              <button class="btn-red" style="padding: 6px 10px; font-size: 12px; margin-left: 4px;" onclick="updateStatus('${w.id}', 'reject')">Reject</button>
            ` : '—'}
          </td>
        </tr>
      `).join('');
    }

    async function updateStatus(id, action) {
      if (!confirm(`Are you sure you want to ${action} this request?`)) return;

      await fetch('/api/admin', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-admin-secret': secret },
        body: JSON.stringify({ id, action })
      });
      loadWithdrawals();
    }
  </script>
</body>
</html>
