<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>My Profile - Free Gram Token</title>

  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- AJAX Seamless Router -->
  <script src="/router.js"></script>

  <style>
    :root {
      --bg: #070a12;
      --card: #0f172a;
      --card-border: rgba(56, 189, 248, 0.15);
      --accent: #38bdf8;
      --btn-bg: #22c55e;
      --text: #ffffff;
      --text-dim: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px 14px 95px 14px;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .card {
      background: var(--card);
      padding: 22px 18px;
      border-radius: 20px;
      border: 1px solid var(--card-border);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6);
    }

    /* Profile Header Info */
    .profile-hero {
      display: flex;
      align-items: center;
      gap: 14px;
      padding-bottom: 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .profile-avatar-wrap {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      position: relative;
      flex-shrink: 0;
    }

    .profile-avatar-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #38bdf8;
      display: none;
      background: #1e293b;
      box-shadow: 0 0 16px rgba(56, 189, 248, 0.4);
    }

    .profile-avatar-fallback {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: linear-gradient(135deg, #38bdf8, #2563eb);
      color: #fff;
      font-size: 24px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid #38bdf8;
      box-shadow: 0 0 16px rgba(56, 189, 248, 0.4);
    }

    .status-badge-dot {
      position: absolute;
      bottom: 2px;
      right: 2px;
      width: 12px;
      height: 12px;
      background: #22c55e;
      border: 2px solid #0f172a;
      border-radius: 50%;
      box-shadow: 0 0 8px #22c55e;
    }

    .profile-meta h2 {
      font-size: 17px;
      font-weight: 800;
      color: #fff;
      margin-bottom: 2px;
    }

    .profile-meta span {
      font-size: 12px;
      color: var(--accent);
    }

    /* Detail Rows */
    .detail-list {
      display: flex;
      flex-direction: column;
      margin-top: 6px;
    }

    .detail-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      font-size: 13px;
    }

    .detail-item:last-child {
      border-bottom: none;
    }

    .detail-label {
      color: var(--text-dim);
      font-size: 12px;
    }

    .detail-value {
      font-weight: 700;
      color: #fff;
    }

    .btn-withdraw {
      width: 100%;
      padding: 15px;
      border-radius: 14px;
      border: none;
      background: linear-gradient(135deg, #38bdf8, #2563eb);
      color: #fff;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      margin-top: 14px;
      box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3);
      transition: transform 0.1s ease;
    }

    .btn-withdraw:active { transform: scale(0.97); }
  </style>
</head>
<body>

  <div class="container">
    <!-- Header dynamically loaded from header.html -->
    <div id="header-container"></div>

    <div class="card">
      <!-- Profile Hero (Photo & Name) -->
      <div class="profile-hero">
        <div class="profile-avatar-wrap">
          <img id="profPhoto" class="profile-avatar-img" src="" alt="User" />
          <div id="profFallback" class="profile-avatar-fallback">K</div>
          <span class="status-badge-dot"></span>
        </div>
        <div class="profile-meta">
          <h2 id="profName">Khudaimi</h2>
          <span id="profUsername">@username</span>
        </div>
      </div>

      <!-- User Stats & Detail Items -->
      <div class="detail-list">
        <div class="detail-item">
          <span class="detail-label">Telegram ID</span>
          <code id="profId" style="color: var(--accent); font-size: 13px;">-</code>
        </div>

        <div class="detail-item">
          <span class="detail-label">Available Balance</span>
          <b id="profBalanceDisplay" style="color: #22c55e; font-size: 14px;">0.00 PTS</b>
        </div>

        <div class="detail-item">
          <span class="detail-label">Today Ads Watch</span>
          <b id="profTodayAds" style="color: #22c55e;">0</b>
        </div>

        <div class="detail-item">
          <span class="detail-label">Total Ads Watch</span>
          <b id="profTotalAds" style="color: var(--accent);">0</b>
        </div>

        <div class="detail-item">
          <span class="detail-label">Friends Invited</span>
          <b id="profInvited" style="color: #facc15;">0</b>
        </div>

        <div class="detail-item">
          <span class="detail-label">Network Status</span>
          <span style="color: #22c55e; font-weight: 800; font-size: 11px;">● ACTIVE</span>
        </div>
      </div>

      <button class="btn-withdraw" onclick="navigateSpa('/withdraw.html')">
        ⚡ Instant Gram Token Withdrawal
      </button>
    </div>

    <!-- Footer dynamically loaded from footer.html -->
    <div id="footer-container"></div>
  </div>

  <script>
    const tg = window.Telegram && window.Telegram.WebApp;
    if (tg) {
      try {
        tg.ready();
        tg.expand();
        tg.BackButton.show();
        tg.BackButton.onClick(() => {
          if (typeof window.navigateSpa === 'function') {
            window.navigateSpa('/index.html');
          } else {
            window.location.href = '/index.html';
          }
        });
      } catch (e) {}
    }

    const user = tg?.initDataUnsafe?.user || { id: "0", first_name: "Khudaimi", username: "" };

    // 1. Initial State Population
    document.getElementById('profName').innerText = user.first_name || 'Khudaimi';
    document.getElementById('profUsername').innerText = user.username ? '@' + user.username : '@none';
    document.getElementById('profId').innerText = user.id;

    const initial = (user.first_name || 'K').charAt(0).toUpperCase();
    document.getElementById('profFallback').innerText = initial;

    // Check Telegram User Profile Photo
    if (user.photo_url) {
      const pEl = document.getElementById('profPhoto');
      const fEl = document.getElementById('profFallback');
      pEl.src = user.photo_url;
      pEl.onload = function() {
        pEl.style.display = 'block';
        fEl.style.display = 'none';
      };
    }

    // 2. Hydrate Header
    fetch('/header.html').then(r => r.text()).then(html => {
      document.getElementById('header-container').innerHTML = html;
      const tgUser = tg?.initDataUnsafe?.user;
      const uEl = document.getElementById('userName');
      const pEl = document.getElementById('userHeaderPhoto');
      const fEl = document.getElementById('userHeaderFallback');
      const tEl = document.getElementById('botTitle');

      if (tEl) tEl.innerText = "Free Gram Token";

      if (tgUser) {
        if (tgUser.first_name && uEl) uEl.innerText = tgUser.first_name;
        if (fEl) fEl.innerText = (tgUser.first_name || 'K').charAt(0).toUpperCase();
        if (tgUser.photo_url && pEl) {
          pEl.src = tgUser.photo_url;
          pEl.style.display = 'block';
          if (fEl) fEl.style.display = 'none';
        }
      }
    });

    // 3. Hydrate Footer
    fetch('/footer.html').then(r => r.text()).then(html => {
      document.getElementById('footer-container').innerHTML = html;
      const s = document.createElement('script');
      s.text = html.match(/<script>([\s\S]*?)<\/script>/)?.[1] || '';
      document.body.appendChild(s);
    });

    // 4. Load Live Stats
    function loadProfileStats() {
      // Load local today ads watch count first
      const todayDateKey = new Date().toISOString().slice(0, 10);
      const storedDate = localStorage.getItem('ad_date_' + user.id);
      let localToday = 0;
      if (storedDate === todayDateKey) {
        localToday = parseInt(localStorage.getItem('today_ads_' + user.id) || '0', 10);
      }
      document.getElementById('profTodayAds').innerText = localToday;

      fetch('/api/get-user', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          telegram_id: user.id,
          first_name: user.first_name,
          username: user.username
        })
      })
      .then(r => r.json())
      .then(data => {
        if (data.status === 'success') {
          document.getElementById('profBalanceDisplay').innerText = `${Number(data.balance || 0).toFixed(2)} PTS`;
          document.getElementById('profTotalAds').innerText = data.ads_watched ?? 0;
          document.getElementById('profInvited').innerText = data.invited_count ?? 0;

          if (data.today_ads_watched !== undefined) {
            const finalToday = Math.max(localToday, Number(data.today_ads_watched));
            document.getElementById('profTodayAds').innerText = finalToday;
          }

          // In case get-user returned a custom photo url
          if (data.photo_url) {
            const pEl = document.getElementById('profPhoto');
            const fEl = document.getElementById('profFallback');
            pEl.src = data.photo_url;
            pEl.onload = function() {
              pEl.style.display = 'block';
              fEl.style.display = 'none';
            };
          }
        }
      })
      .catch(err => console.error("Profile load note:", err));
    }

    loadProfileStats();
  </script>
</body>
</html>
