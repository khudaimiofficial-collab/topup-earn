<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Profile - Free Top-Up</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #070a12;
      --card: #0f172a;
      --card-border: rgba(56, 189, 248, 0.12);
      --accent: #38bdf8;
      --text: #ffffff;
      --text-dim: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 12px 14px 90px 14px; }
    .container { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 14px; }
    .card { background: var(--card); padding: 22px 18px; border-radius: 20px; border: 1px solid var(--card-border); box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6); }
    .avatar-circle { width: 56px; height: 56px; border-radius: 50%; background: linear-gradient(135deg, #38bdf8, #2563eb); display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 800; color: #fff; box-shadow: 0 0 20px rgba(56, 189, 248, 0.5); }
    .detail-item { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.06); font-size: 13px; }
    .btn-withdraw { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid var(--card-border); background: rgba(255,255,255,0.08); color: #fff; font-weight: 800; cursor: pointer; margin-top: 10px; }
  </style>
</head>
<body>

  <div class="container">
    <div id="header-container"></div>

    <div class="card">
      <div style="display: flex; align-items: center; gap: 14px; padding-bottom: 14px; border-bottom: 1px solid rgba(255,255,255,0.08);">
        <div class="avatar-circle" id="profAvatarLetter">G</div>
        <div>
          <h2 id="profName" style="font-size: 16px; font-weight: 800;">Gamer</h2>
          <span id="profUsername" style="font-size: 12px; color: var(--text-dim);">@username</span>
        </div>
      </div>

      <div class="detail-item">
        <span style="color: var(--text-dim);">Telegram ID</span>
        <code id="profId" style="color: var(--accent); font-size: 14px;">-</code>
      </div>

      <div class="detail-item">
        <span style="color: var(--text-dim);">Available Balance</span>
        <b id="profBalanceDisplay" style="color: #22c55e;">0.00 PTS</b>
      </div>

      <div class="detail-item">
        <span style="color: var(--text-dim);">Ads Watched</span>
        <b id="profAdsDisplay">0</b>
      </div>

      <div class="detail-item">
        <span style="color: var(--text-dim);">Friends Invited</span>
        <b id="profInvitedDisplay" style="color: var(--accent);">0</b>
      </div>

      <div class="detail-item" style="border-bottom: none;">
        <span style="color: var(--text-dim);">Store Portal</span>
        <span style="font-size: 12px; color: var(--accent); cursor: pointer;" onclick="tg.openLink('https://automaticgametopup.iceiy.com')">automaticgametopup ➔</span>
      </div>

      <button class="btn-withdraw" onclick="location.href='/withdraw.html'">
        💳 Go to Withdrawals
      </button>
    </div>

    <div id="footer-container"></div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (!tg?.initData || tg.initData.length === 0) {
      location.href = '/index.html';
    }
    tg.ready();
    tg.expand();
    tg.BackButton.show();
    tg.BackButton.onClick(() => { location.href = '/index.html'; });

    const user = tg.initDataUnsafe?.user || { id: "0", first_name: "Gamer", username: "" };

    document.getElementById('profName').innerText = user.first_name || 'Gamer';
    document.getElementById('profAvatarLetter').innerText = (user.first_name || 'G')[0].toUpperCase();
    document.getElementById('profUsername').innerText = user.username ? `@${user.username}` : '@none';
    document.getElementById('profId').innerText = user.id;

    fetch('/header.html').then(r => r.text()).then(html => {
      document.getElementById('header-container').innerHTML = html;
      if (user?.first_name) {
        const el = document.getElementById('userName');
        if (el) el.innerText = user.first_name;
      }
      const savedName = sessionStorage.getItem('bot_name');
      if (savedName) {
        const titleEl = document.getElementById('botTitle');
        if (titleEl) titleEl.innerText = savedName;
      }
    });

    fetch('/footer.html').then(r => r.text()).then(html => {
      document.getElementById('footer-container').innerHTML = html;
      const s = document.createElement('script');
      s.text = html.match(/<script>([\s\S]*?)<\/script>/)?.[1] || '';
      document.body.appendChild(s);
    });

    fetch('/api/get-user', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ telegram_id: user.id, first_name: user.first_name, username: user.username })
    })
    .then(r => r.json())
    .then(data => {
      if (data.status === 'success') {
        document.getElementById('profBalanceDisplay').innerText = `${Number(data.balance).toFixed(2)} PTS`;
        document.getElementById('profAdsDisplay').innerText = data.ads_watched;
        document.getElementById('profInvitedDisplay').innerText = data.invited_count || 0;

        if (data.bot_name) {
          sessionStorage.setItem('bot_name', data.bot_name);
          const titleEl = document.getElementById('botTitle');
          if (titleEl) titleEl.innerText = data.bot_name;
        }
      }
    });
  </script>
</body>
</html>
